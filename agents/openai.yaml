interface:
  display_name: "Large Task Orchestrator"
  short_description: "Align the outcome, scope, and acceptance before complex work"
  default_prompt: "Use $large-task-orchestrator for the following task; investigate and align the outcome, scope, acceptance, and necessary decisions with me first, then automatically create a persistent goal when ready and execute until the entire outcome and every necessary acceptance criterion are satisfied:"
policy:
  allow_implicit_invocation: false
